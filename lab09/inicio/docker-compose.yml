name: tw2-lab09-inicio
services:
  php:
    build:
      context: ../..
    image: tw2-php:8.3
    working_dir: /app
    volumes:
      - .:/app
      - ../../comun:/comun:ro
    ports:
      - "127.0.0.1:8000:8000"
    command: ["php", "-S", "0.0.0.0:8000", "-t", "public", "public/index.php"]
    environment:
      BD_HOST: mysql
      BD_PUERTO: "3306"
      BD_NOMBRE: apicultores
      BD_USUARIO: apicultores
      BD_CLAVE: miel2026
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: apicultores
      MYSQL_USER: apicultores
      MYSQL_PASSWORD: miel2026
      MYSQL_ROOT_PASSWORD: raiz2026
      TZ: America/La_Paz
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - datos_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  datos_mysql:
